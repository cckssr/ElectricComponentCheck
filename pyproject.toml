[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electric-component-check"
version = "0.1.0"
description = "LCR measurement uncertainty calculator with GUI for electrical component testing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Cedric Kessler", email = "cedric.kessler@me.com"}
]
keywords = ["lcr", "measurement", "uncertainty", "electrical", "components", "testing", "openbis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PySide6>=6.9.0",
    "pybis",
    "pymeasure",
    "pyvisa",
    "pyqtgraph",
    "platformdirs",
    "reportlab",
    "pandas",
    "matplotlib",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/cckssr/ElectricComponentCheck"
Documentation = "https://github.com/cckssr/ElectricComponentCheck#readme"
Repository = "https://github.com/cckssr/ElectricComponentCheck.git"
Issues = "https://github.com/cckssr/ElectricComponentCheck/issues"

[project.scripts]
electric-component-check = "electric_component_check.mainwindow:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["electric_component_check*"]

[tool.setuptools.package-data]
electric_component_check = ["*.json", "*.toml", "ui/*.ui"]

[tool.ruff]
line-length = 100
target-version = "py311"
# form_ui.py / calibration_ui.py are pyside6-uic output (`make ui` regenerates
# them from form.ui / calibration.ui) -- linting/formatting them here just
# fights the next regeneration.
extend-exclude = ["src/electric_component_check/ui/form_ui.py", "src/electric_component_check/ui/calibration_ui.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
# numpy's bundled stubs use PEP 695 `type` statements unconditionally, which
# mypy can only parse at python_version >= 3.12 -- even though the app itself
# supports 3.11+. Pinning lower breaks type-checking on any numpy import.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^test/"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
